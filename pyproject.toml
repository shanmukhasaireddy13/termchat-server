[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termchat-client"
version = "0.2.3"

description = "Lightweight, non-intrusive terminal chat client connecting to an online chat server with real-time text, images, and AI assistant."

readme = "README.md"
authors = [
    { name = "TermChat Team", email = "info@termchat.dev" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
keywords = [
    "chat",
    "terminal",
    "cli",
    "websocket",
    "raspberry-pi",
    "linux",
    "windows",
    "render",
    "image-chat"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Terminals",
]

dependencies = [
    "websockets>=12.0",
    "prompt_toolkit>=3.0.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "fastapi>=0.100.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
termchat = "termchat.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/termchat"
Repository = "https://github.com/your-username/termchat"
Issues = "https://github.com/your-username/termchat/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["termchat*"]
exclude = ["termchat.__pycache__*", "tests*", "server*"]

